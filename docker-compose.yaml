services:
  hermes:
    env_file: ".env"
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-agent-custom:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    network_mode: "host"
    volumes:
      - ~/.hermes:/opt/data
      - ./scripts:/opt/data/scripts
      - ./skills:/opt/data/skills
    environment:
      - HERMES_DASHBOARD=1

      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${DASH_USER}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${DASH_PASS}

      - OPENAI_API_BASE=${OMNIROUTE_URL}
      - OPENAI_BASE_URL=${OMNIROUTE_URL}
      - OPENAI_API_KEY=${OMNIROUTE_API_KEY}
